repos:
  - repo: local
    hooks:
      - id: python-compile-benchmark-scripts
        name: py_compile benchmark scripts
        entry: python3 -m py_compile
        language: system
        files: ^\.github/scripts/bench/.*\.py$

      - id: release-ci-tag
        name: release CI tag from pyproject version
        entry: python3 scripts/release_ci_ref.py --allow-noop
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

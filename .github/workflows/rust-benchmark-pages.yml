name: Reusable Rust Divan Benchmark Pages

on:
  workflow_call:
    inputs:
      rust_toolchain:
        type: string
        required: false
        default: stable
      pages_artifact_path:
        type: string
        required: false
        default: target/divan-pages
      run_command:
        type: string
        required: false
        default: cargo bench -- --color never
      divan_output_path:
        type: string
        required: false
        default: target/divan-pages/divan.txt
      plotly_script_path:
        type: string
        required: false
        default: .ci/.github/scripts/bench/render_divan_plotly.py

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Divan report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: jcfangc/ci
          path: .ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ inputs.rust_toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Divan benchmarks
        env:
          NO_COLOR: "1"
          COLUMNS: "240"
          DIVAN_OUTPUT_PATH: ${{ inputs.divan_output_path }}
        run: |
          set -euo pipefail

          rm -rf "${{ inputs.pages_artifact_path }}"
          mkdir -p "$(dirname "$DIVAN_OUTPUT_PATH")"

          ${{ inputs.run_command }} | tee "$DIVAN_OUTPUT_PATH"

      - name: Render Plotly comparison report
        env:
          DIVAN_PAGES_ROOT: ${{ inputs.pages_artifact_path }}
          DIVAN_OUTPUT: ${{ inputs.divan_output_path }}
          PLOTLY_REPORT_DIR: compare-plotly
        run: |
          set -euo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install plotly
          python3 "${{ inputs.plotly_script_path }}"

      - name: Prepare Pages site
        run: |
          set -euo pipefail

          test -f "${{ inputs.pages_artifact_path }}/index.html"
          test -f "${{ inputs.pages_artifact_path }}/.nojekyll"
          test -f "${{ inputs.pages_artifact_path }}/divan.txt"
          test -f "${{ inputs.pages_artifact_path }}/compare-plotly/index.html"

          find "${{ inputs.pages_artifact_path }}" -maxdepth 3 -type f | sort | sed -n '1,120p'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.pages_artifact_path }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
